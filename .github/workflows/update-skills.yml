name: Update Skills

on:
  workflow_dispatch:
  # TODO(JoseAlcerreca): enable schedule when ready
  # schedule:
  #   - cron: '0 * * * *' # Runs at minute 0 of every hour

permissions:
  contents: write
  pull-requests: write

jobs:
  update-skills:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          token: ${{ secrets.ADR_GITHUB_BOT_PAT }}

      - name: Delete existing non-hidden directories
        run: |
          # Cleans up existing folders so we don't have stale files
          find . -mindepth 1 -maxdepth 1 -type d ! -name '.*' -exec rm -rf {} +

      - name: Download and Extract dac_skills
        run: |
          curl -L -O https://dl.google.com/dac/dac_skills.zip
          mkdir temp_extract
          unzip -o dac_skills.zip -d temp_extract
          # Only copy directories from the root of the zip, ignoring files in the root
          if ls -d temp_extract/[!.]*/ >/dev/null 2>&1; then
            cp -r temp_extract/[!.]*/ .
          fi
          rm -rf temp_extract dac_skills.zip

      - name: Copy contents of github-skills branch
        run: |
          git fetch origin github-skills:github-skills

          # 2. Create a temporary directory to hold the skills files
          mkdir temp_skills

          # 3. Use 'git archive' to "export" the folders from that branch 
          # and extract them into our temp folder. This avoids index errors.
          git archive github-skills | tar -x -C temp_skills

          # 4. Move the contents into the root directory
          # This will overwrite any existing folders with the same name
          if ls -d temp_skills/[!.]*/ >/dev/null 2>&1; then
            cp -r temp_skills/[!.]*/ .
            echo "Successfully moved non-hidden directories from github-skills."
          else
            echo "No non-hidden directories found to copy."
          fi
          
          # 5. Clean up the temp folder
          rm -rf temp_skills
          echo "Successfully copied directories from github-skills branch."

      - name: Update Skill Lists in Plugin Files
        run: |
          python3 -c "
          import json
          import pathlib

          # Discover all skills with SKILL.md
          skill_paths = []
          for path in pathlib.Path('.').glob('**/SKILL.md'):
              if any(p.startswith('.') for p in path.parts[:-1]):
                  continue
              skill_paths.append(f'./{path.parent.as_posix()}')

          skill_paths = sorted(list(set(skill_paths)))

          # 1. Update .claude-plugin/plugin.json in-place.
          #    The skill list belongs in the plugin MANIFEST, never in the
          #    marketplace entry. Component fields such as 'skills' on the entry
          #    are rejected by Anthropic's plugin directory with
          #    MARKETPLACE_ENTRY_INLINE_MANIFEST.
          claude_manifest = pathlib.Path('.claude-plugin/plugin.json')
          if not claude_manifest.exists():
              raise FileNotFoundError(f'Required file {claude_manifest} does not exist. Ensure you are running on the correct branch.')

          with open(claude_manifest, 'r') as f:
              data = json.load(f)
          data['skills'] = skill_paths
          with open(claude_manifest, 'w') as f:
              json.dump(data, f, indent=2)
              f.write('\n')

          # 2. Keep .claude-plugin/marketplace.json a pure catalogue.
          #    With a plugin.json present, strict:false plus any component field
          #    makes the plugin fail to load with 'conflicting manifests'.
          claude_marketplace = pathlib.Path('.claude-plugin/marketplace.json')
          if not claude_marketplace.exists():
              raise FileNotFoundError(f'Required file {claude_marketplace} does not exist. Ensure you are running on the correct branch.')

          with open(claude_marketplace, 'r') as f:
              data = json.load(f)
          if 'plugins' in data and len(data['plugins']) > 0:
              for stale in ('skills', 'strict', 'commands', 'agents', 'hooks', 'outputStyles', 'themes'):
                  data['plugins'][0].pop(stale, None)
          with open(claude_marketplace, 'w') as f:
              json.dump(data, f, indent=2)
              f.write('\n')

          # 3. Update .codex-plugin/plugin.json in-place
          codex_file = pathlib.Path('.codex-plugin/plugin.json')
          if not codex_file.exists():
              raise FileNotFoundError(f'Required file {codex_file} does not exist. Ensure you are running on the correct branch.')

          with open(codex_file, 'r') as f:
              data = json.load(f)
          data['skills'] = [{'source': {'path': p}} for p in skill_paths]
          with open(codex_file, 'w') as f:
              json.dump(data, f, indent=2)
              f.write('\n')
          "

      - name: Commit and push to PR branch
        run: |
          BRANCH="update-skills/$(date +'%Y-%m-%d-%H%M')"

          git config user.name "android-devrel-github-bot"
          git config user.email "android-devrel-github-bot@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add -A

          # The workflow doesn't fail if there's nothing new to commit
          if git diff --cached --quiet; then
            echo "No changes to commit — skipping PR creation."
            exit 0
          fi

          git commit -m "Updates skills ($(date +'%Y-%m-%d %H:%M'))"
          git push origin "$BRANCH"
          gh pr create \
            --title "Update skills ($(date +'%Y-%m-%d %H:%M'))" \
            --body "Automated skill update from the \`Update Skills\` workflow. Please review the changes before merging." \
            --base main \
            --head "$BRANCH"
        env:
          GH_TOKEN: ${{ secrets.ADR_GITHUB_BOT_PAT }}